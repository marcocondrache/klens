# Schema: https://json.schemastore.org/cargo-mutants-config.json
test_tool = "nextest"

exclude_globs = [
    # Only compiled with the `ui` feature, which needs the built web bundle.
    "src/server/web.rs",
    # Only wires the process together at startup; no test runs `main`.
    "src/main.rs",
    # The end-to-end harness, which only runs against Kafka in Docker.
    "e2e/**",
]

exclude_re = [
    '<impl (\w+::)*Debug for ',
    '>::expecting\b',
    # krafka's FakeBroker has no IncrementalAlterConfigs, CreatePartitions,
    # DeleteRecords, DeleteGroups, OffsetDelete, CreateAcls, DeleteAcls or
    # AlterClientQuotas handler, so the e2e journeys on a real broker cover
    # these.
    'KafkaClient>::alter_topic_configs\b',
    '\bKafkaClient::alter_configs\b',
    'KafkaClient>::add_partitions\b',
    'KafkaClient>::delete_records\b',
    'KafkaClient>::delete_group\b',
    'KafkaClient>::delete_group_offsets\b',
    'KafkaClient>::create_acls\b',
    'KafkaClient>::delete_acl\b',
    'KafkaClient>::alter_client_quota\b',
    '\bKafkaClient::group_coordinator\b',
    'kafka/client\.rs:\d+:\d+: replace call\b',
]
