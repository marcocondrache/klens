# Schema: https://json.schemastore.org/cargo-mutants-config.json
test_tool = "nextest"

exclude_globs = [
    # Only compiled with the `ui` feature, which needs the built web bundle.
    "src/server/web.rs",
    # Only wires the process together at startup; no test runs `main`.
    "src/main.rs",
    # The end-to-end harness, which only runs against Kafka in Docker.
    "e2e/**",
]

exclude_re = [
    '<impl (\w+::)*Debug for ',
    '>::expecting\b',
    # krafka's FakeBroker has no IncrementalAlterConfigs, CreatePartitions or
    # DeleteRecords handler, so the e2e journeys on a real broker cover these.
    'KafkaClient>::alter_topic_configs\b',
    '\bKafkaClient::alter_configs\b',
    'KafkaClient>::add_partitions\b',
    'KafkaClient>::delete_records\b',
]
