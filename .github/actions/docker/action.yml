name: docker
description: Build and push the container image to GHCR.

inputs:
  image:
    description: Image name to build.
    required: false
    default: ghcr.io/${{ github.repository }}
  version:
    description: Version tag to apply (e.g. 0.1.0 from a v0.1.0 git tag).
    required: true
  gh-token:
    description: Token used to log in to GHCR.
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      id: buildx

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.gh-token }}

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: cache
      with:
        path: cache-mount
        key: docker-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          docker-cargo-${{ runner.os }}-

    - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        cache-dir: cache-mount
        dockerfile: Dockerfile
        skip-extraction: ${{ steps.cache.outputs.cache-hit }}

    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        push: true
        tags: |
          ${{ inputs.image }}:${{ inputs.version }}
          ${{ inputs.image }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
