name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  semantic-release:
    name: semantic-release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Bootstrap or release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git checkout -B main

          if [[ -z "$(git tag -l 'v*')" ]]; then
            gh release create v0.1.0 \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "v0.1.0" \
              --notes "Initial release."
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREFIX="${RUNNER_TEMP}/semantic-release"
          mkdir -p "$PREFIX"
          bun add --cwd "$PREFIX" \
            semantic-release@25.0.9 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/git@11.0.1 \
            @semantic-release/github@12.0.9 \
            conventional-changelog-conventionalcommits@9.3.1 # writer@8 until semantic-release ships writer@9
          export NODE_PATH="$PREFIX/node_modules${NODE_PATH:+:$NODE_PATH}"
          bun "$PREFIX/node_modules/semantic-release/bin/semantic-release.js"

  publish-image:
    name: publish
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.semantic-release.outputs.new_release_version }}
      - uses: ./.github/actions/docker
        with:
          version: ${{ needs.semantic-release.outputs.new_release_version }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
