name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  semantic-release:
    name: semantic-release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # semantic-release only sees tags reachable from HEAD, so after a history
      # rewrite it would restart at 1.0.0. Tags are immutable, so instead of
      # moving the latest one, locally graft its rewritten twin (same tree)
      # onto it. Replace refs are never pushed.
      - name: Reattach the latest tag after history rewrites
        run: |
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [[ -z "$latest" ]] || git merge-base --is-ancestor "$latest" HEAD; then
            exit 0
          fi

          released="$(git rev-parse "$latest^{commit}")"
          tree="$(git rev-parse "$released^{tree}")"
          match="$(git log --format='%T %H' HEAD | awk -v tree="$tree" '$1 == tree && !found { print $2; found = 1 }')"
          if [[ -z "$match" ]]; then
            echo "::error::$latest is not on main and no commit on main has the same tree."
            exit 1
          fi

          while read -r commit parents; do
            [[ " $parents " == *" $match "* ]] || continue
            git replace -f --graft "$commit" ${parents//$match/$released}
          done < <(git rev-list --parents HEAD)
      - name: Bootstrap or release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -B main

          if [[ -z "$(git tag -l 'v*')" ]]; then
            gh release create v0.1.0 \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "v0.1.0" \
              --notes "Initial release."
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREFIX="${RUNNER_TEMP}/semantic-release"
          mkdir -p "$PREFIX"
          bun add --cwd "$PREFIX" \
            semantic-release@25.0.9 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/github@12.0.9 \
            conventional-changelog-conventionalcommits@9.3.1 # writer@8 until semantic-release ships writer@9
          export NODE_PATH="$PREFIX/node_modules${NODE_PATH:+:$NODE_PATH}"
          bun "$PREFIX/node_modules/semantic-release/bin/semantic-release.js"

  publish-image:
    name: publish
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.semantic-release.outputs.new_release_version }}
      - uses: ./.github/actions/docker
        with:
          version: ${{ needs.semantic-release.outputs.new_release_version }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  publish-chart:
    name: publish chart
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.semantic-release.outputs.new_release_version }}
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push the chart
        env:
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
        run: |
          dest="${RUNNER_TEMP}/chart"
          mkdir -p "$dest"
          repository="$(printf 'oci://ghcr.io/%s/charts' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          helm package charts/klens \
            --destination "$dest" \
            --version "$VERSION" \
            --app-version "$VERSION"
          helm push "$dest/klens-${VERSION}.tgz" "$repository"
