name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  release:
    name: release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install git-cliff
        uses: taiki-e/install-action@38b1fd13a590e3952f526bee6fb646afed8301a1 # git-cliff
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # CI runs on main can finish out of order: a newer commit's release
          # may already include this one.
          if [[ -n "$(git tag --list 'v*' --contains "${SHA}")" ]]; then
            echo "${SHA} is already part of a release."
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # With no v* tag yet, git-cliff falls back to bump.initial_tag in cliff.toml.
          next="$(git cliff --bumped-version)"

          # git-cliff answers with the latest tag when nothing since it cuts a
          # release (only chore, refactor, docs, ...), which includes reruns.
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            if git merge-base --is-ancestor "${next}" "${SHA}"; then
              echo "Nothing to release since ${next}."
              echo "new_release_published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::${next} already exists but is not an ancestor of ${SHA}."
            exit 1
          fi

          notes="${RUNNER_TEMP}/release-notes.md"
          git cliff --unreleased --tag "${next}" --strip all --output "${notes}"
          gh release create "${next}" \
            --target "${SHA}" \
            --title "${next}" \
            --notes-file "${notes}"

          echo "new_release_published=true" >> "$GITHUB_OUTPUT"
          echo "new_release_version=${next#v}" >> "$GITHUB_OUTPUT"

  publish-image:
    name: publish
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
      - uses: ./.github/actions/docker
        with:
          version: ${{ needs.release.outputs.new_release_version }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  publish-chart:
    name: publish chart
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push the chart
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          dest="${RUNNER_TEMP}/chart"
          mkdir -p "$dest"
          repository="$(printf 'oci://ghcr.io/%s/charts' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          helm package charts/klens \
            --destination "$dest" \
            --version "$VERSION" \
            --app-version "$VERSION"
          helm push "$dest/klens-${VERSION}.tgz" "$repository"
