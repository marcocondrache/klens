name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  release:
    name: release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install git-cliff
        uses: taiki-e/install-action@31f14f7508924f579d2d6cbf1cce2968b5510b39 # git-cliff
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ -n "$(git tag --list 'v*' --contains "${SHA}")" ]]; then
            echo "${SHA} is already part of a release."
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          next="$(git cliff --unreleased --bumped-version)"

          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "::error::${next} already exists."
            exit 1
          fi

          notes="${RUNNER_TEMP}/release-notes.md"
          errors="${RUNNER_TEMP}/release-errors.txt"
          git cliff --unreleased --strip all --output "${notes}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag_release() {
            local version="${1#v}"
            git checkout --quiet --detach "${SHA}"
            sed -i "0,/^version = .*/s//version = \"${version}\"/" Cargo.toml
            sed -i "/^name = \"klens\"$/{n;s/^version = .*/version = \"${version}\"/}" Cargo.lock
            git commit --quiet --all --message "chore(release): ${1}"
            git tag "${1}"
          }

          while true; do
            tag_release "${next}"
            if git push --quiet origin "refs/tags/${next}" 2> "${errors}" &&
              gh release create "${next}" \
                --verify-tag \
                --title "${next}" \
                --notes-file "${notes}" 2> "${errors}"; then
              break
            fi
            cat "${errors}" >&2
            grep -q 'immutable release' "${errors}" || exit 1
            echo "::warning::${next} belonged to a deleted immutable release, trying the next patch."
            git push --quiet --delete origin "refs/tags/${next}" || true
            git tag --delete "${next}"
            IFS=. read -r major minor patch <<< "${next#v}"
            next="v${major}.${minor}.$((patch + 1))"
          done

          echo "new_release_published=true" >> "$GITHUB_OUTPUT"
          echo "new_release_version=${next#v}" >> "$GITHUB_OUTPUT"

  publish-image:
    name: publish
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
      - uses: ./.github/actions/docker
        with:
          version: ${{ needs.release.outputs.new_release_version }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  publish-chart:
    name: publish chart
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push the chart
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          dest="${RUNNER_TEMP}/chart"
          mkdir -p "$dest"
          repository="$(printf 'oci://ghcr.io/%s/charts' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          helm package charts/klens \
            --destination "$dest" \
            --version "$VERSION" \
            --app-version "$VERSION"
          helm push "$dest/klens-${VERSION}.tgz" "$repository"
