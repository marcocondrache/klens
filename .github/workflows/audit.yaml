name: audit
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  cargo:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@031bfc83e95968e35021f0e138651dba756b815e # cargo-audit
      - name: Audit dependencies
        run: cargo audit

  bun:
    name: bun audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Audit dependencies
        working-directory: web
        # braces reaches only the shadcn CLI, and no braces release fixes GHSA-vfj7-8cjw-p6xm yet.
        run: bun audit --ignore=GHSA-vfj7-8cjw-p6xm
