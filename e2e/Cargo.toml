[package]
name = "e2e"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
klens = { path = ".." }
krafka = { git = "https://github.com/hupe1980/krafka", rev = "2512eb7f41f81f26a9dc5218cc595a9d41b79dfd" }
reqwest = { version = "0.13", default-features = false }
serde_json = "1"
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["kafka"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
zeroize = "1"
