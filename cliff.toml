# git-cliff drives releases: .github/workflows/release.yaml asks it for the
# next version and for the release notes. See https://git-cliff.org/docs.

[changelog]
body = """
{%- set repo = "https://github.com/marcocondrache/klens" -%}
{% if version -%}
  {% if previous.version -%}
    ## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/compare/{{ previous.version }}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
  {% else -%}
    ## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
  {% endif -%}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {% if commit.breaking %}[**breaking**] {% endif %}\
  {{ commit.message | split(pat="\n") | first | trim }} \
  ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
# Link "(#123)" PR references, as the old notes did.
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/marcocondrache/klens/issues/${1}))" },
]
# Only these types cut a release, as semantic-release's defaults did; every
# other conventional type (chore, refactor, docs, ci, ...) is skipped, so a
# run with nothing but those produces no release.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance Improvements" },
  { message = "^revert", group = "<!-- 3 -->Reverts" },
  { field = "breaking", pattern = "true", group = "<!-- 4 -->Breaking Changes" },
  { body = ".*", skip = true },
]

[bump]
# Used when there is no v* tag yet, so the first release needs no special case.
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = true
