suite: secret
templates:
  - secret.tpl
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders stringData when inline keys are set
    set:
      secret.stringData:
        KAFKA_PASSWORD: hunter2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: stringData.KAFKA_PASSWORD
          value: "hunter2"

  - it: renders nothing when an existing Secret is provided
    set:
      secret.existingSecret: klens-creds
      secret.stringData:
        KAFKA_PASSWORD: ignored
    asserts:
      - hasDocuments:
          count: 0
