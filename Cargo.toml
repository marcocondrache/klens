[package]
name = "klens"
version = "0.81.4"
edition = "2024"
publish = false

[package.metadata.cargo-machete]
ignored = ["cookie"]

[features]
ui = ["dep:memory-serve"]
typescript = []

[workspace]
members = ["xtask"]
default-members = ["."]

[dependencies]
anyhow = "1"
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
itertools = "0.14"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "tracing",
] }
axum-extra = { version = "0.12", default-features = false, features = ["query"] }
axum-login = "0.18"
# Pulled in only for `key-expansion`, which is what gives
# `tower_sessions::cookie::Key::derive_from` (HKDF) so a configured session
# secret does not have to be a full 64-byte key.
cookie = { version = "0.18", features = ["key-expansion"] }
tower-sessions = { version = "0.14", features = ["memory-store", "signed"] }
futures = "0.3"
jiff = { version = "0.2", default-features = false, features = ["serde", "std"] }
krafka = { git = "https://github.com/hupe1980/krafka", rev = "e6b154cef8dd0bfe7b2c8fadbf925c1e6494310f" }
moka = { version = "0.12", features = ["future", "sync"] }
memory-serve = { version = "2.4", optional = true }
openidconnect = "4.0.1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower = { version = "0.5.3" }
tower-http = { version = "0.6", features = [
    "catch-panic",
    "compression-br",
    "compression-gzip",
    "compression-zstd",
    "sensitive-headers",
    "trace",
] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
base64 = "0.22"
schemreg = { version = "0.6", features = ["confluent", "avro"] }
apache-avro = "0.21"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
regex = "1.13"
aho-corasick = "1.1"
arc-swap = "1.9.2"
foldhash = "0.2.0"
ts-rs = { version = "12.0.1", features = ["jiff-impl", "serde-compat"] }
frizbee = "0.13"

[build-dependencies]
memory-serve = { version = "2.4", optional = true }

[dev-dependencies]
krafka = { git = "https://github.com/hupe1980/krafka", rev = "e6b154cef8dd0bfe7b2c8fadbf925c1e6494310f", features = ["test-broker"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6.5"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
panic = 'abort'
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
