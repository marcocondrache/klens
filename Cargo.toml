[package]
name = "klens"
version = "0.104.31"
edition = "2024"
publish = false

[workspace]
members = ["e2e", "xtask"]
default-members = ["."]

[features]
typescript = []
ui = ["dep:memory-serve"]

[dependencies]
aho-corasick = "1.1"
anyhow = "1"
apache-avro = "0.22"
arc-swap = "1.9.2"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "macros",
    "tokio",
    "tracing",
] }
axum-extra = { version = "0.12", default-features = false, features = ["cookie-signed", "query"] }
axum-login = "0.18"
base64 = "0.23"
bytes = "1"
config = { version = "0.15", default-features = false, features = ["preserve_order", "yaml"] }
enumset = "1.1"
foldhash = "0.2.0"
frizbee = "0.13"
futures = "0.3"
governor = { version = "0.10", default-features = false, features = ["std"] }
hmac = "0.13"
indexmap = { version = "2", features = ["serde"] }
itertools = "0.15"
jiff = { version = "0.2", default-features = false, features = ["serde", "std"] }
krafka = "0.27.1"
memory-serve = { version = "2.4", optional = true }
moka = { version = "0.12", features = ["future", "sync"] }
openidconnect = "4.0.1"
ouroboros = "0.18"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
rand = "0.10"
regex = "1.13"
rmcp = { version = "=3.5.1", default-features = false, features = [
    "macros",
    "server",
    "transport-streamable-http-server",
] }
schemars = { version = "1.2", features = ["jiff02"] }
schemreg = { version = "0.6", features = ["confluent"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7", features = [
    "catch-panic",
    "compression-br",
    "compression-gzip",
    "compression-zstd",
    "sensitive-headers",
    "trace",
] }
tower-sessions = { version = "0.14", default-features = false, features = ["signed"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["jiff-impl", "serde-compat"] }
url = { version = "2.5.8", features = ["serde"] }
zeroize = "1"

[build-dependencies]
memory-serve = { version = "2.4", optional = true }

[dev-dependencies]
krafka = { version = "0.27.1", features = ["test-broker"] }
percent-encoding = "2.3"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
walkdir = "2.5"
wiremock = "0.6.5"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
panic = "abort"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
