[package]
name = "klens"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.cargo-machete]
ignored = ["cookie"]

[features]
ui = ["dep:rust-embed", "dep:mime_guess"]
# SDL printing for `xtask schema`. The server does not link the parser.
schema-language = ["juniper/schema-language"]

[workspace]
members = ["xtask"]
default-members = ["."]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[dependencies]
anyhow = "1"
async-trait = "0.1"
indexmap = "2"
# Drop default `form`, `matched-path`, `original-uri`, and `tower-log`.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "http2",
    "json",
    "query",
    "tokio",
    "tracing",
    "ws",
] }
axum-login = "0.18"
# Pulled in only for `key-expansion`, which is what gives
# `tower_sessions::cookie::Key::derive_from` (HKDF) so a configured session
# secret does not have to be a full 64-byte key.
cookie = { version = "0.18", features = ["key-expansion"] }
tower-sessions = { version = "0.14", features = ["memory-store", "signed"] }
futures = "0.3"
# Instants only. Default features enable the time zone database, which this
# crate never queries.
jiff = { version = "0.2", default-features = false, features = ["std"] }
juniper = { version = "0.17", features = ["jiff"] }
juniper_axum = { version = "0.3", features = ["subscriptions"] }
juniper_graphql_ws = { version = "0.5", features = ["graphql-transport-ws", "graphql-ws"] }
krafka = { git = "https://github.com/hupe1980/krafka", rev = "776ac3402150289fbcab989d81265af4c7f31eaa" }
moka = { version = "0.12", features = ["future"] }
mime_guess = { version = "2", optional = true }
# Discovery and the token endpoint go through `openidconnect::reqwest`
# (reqwest 0.12, rustls + ring). A direct reqwest 0.13 `rustls` feature
# enables aws-lc-rs on the shared rustls crate, on top of krafka's ring.
openidconnect = "4.0.1"
rust-embed = { version = "8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
shellexpand = { version = "3.1", default-features = false, features = ["base-0"] }
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower = { version = "0.5.3" }
tower-http = { version = "0.6", features = ["catch-panic", "trace", "sensitive-headers"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
base64 = "0.22"
schemreg = { version = "0.6", features = ["confluent", "avro"] }
apache-avro = "0.21"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
regex = "1.13"
arc-swap = "1.9.2"
foldhash = "0.2.0"

[dev-dependencies]
juniper_subscriptions = "0.18"
krafka = { git = "https://github.com/hupe1980/krafka", rev = "776ac3402150289fbcab989d81265af4c7f31eaa", features = ["test-broker"] }
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6.5"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
panic = 'abort'
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
