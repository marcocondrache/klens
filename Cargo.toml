[package]
name = "klens"
version = "0.1.0"
edition = "2024"
publish = false

[features]
ui = ["dep:rust-embed", "dep:mime_guess"]

[workspace]
members = ["xtask"]
default-members = ["."]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2"] }
juniper = { version = "0.17", features = ["schema-language"] }
juniper_axum = "0.3"
mime_guess = { version = "2", optional = true }
rdkafka = { version = "0.39", features = ["ssl-vendored", "libz-static"] }
rust-embed = { version = "8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6", features = ["catch-panic", "trace", "request-id", "sensitive-headers"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
