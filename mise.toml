[tools]
bun = "latest"
node = "latest"
rpk = "26.2.2"
rust = "latest"
vendir = "0.46.0"
viteplus = "latest"

[tasks.schema]
description = "Regenerate schema.graphql from the Rust schema"
run = "cargo xtask schema"

[tasks.vendor]
description = "Sync vendored third-party files declared in vendir.yml"
run = "vendir sync"

[tasks."web:install"]
description = "Install web dependencies"
dir = "web"
run = "vp install"

[tasks."web:codegen"]
description = "Generate TypeScript GraphQL documents from schema.graphql and graphql() operations"
dir = "web"
depends = ["schema", "web:install"]
run = "vp run codegen"

[tasks."web:dev"]
description = "Run the Vite dev server (proxies /graphql, /auth, /api and /health to :8080)"
dir = "web"
depends = ["web:install"]
run = "vp dev"

[tasks."web:check"]
description = "Format, lint, and type-check the web UI"
dir = "web"
depends = ["web:install"]
run = "vp check"

[tasks."web:build"]
description = "Build the web UI into static/"
dir = "web"
depends = ["web:install", "web:codegen"]
run = "vp run build"

[tasks."kafka:up"]
description = "Start local Redpanda (Kafka API :9092, Schema Registry :8081; needs Docker/Podman)"
run = """
rpk container start \
  --kafka-ports 9092 \
  --schema-registry-ports 8081 \
  --console-port 8082
"""

[tasks."kafka:down"]
description = "Stop the local Redpanda container cluster"
run = "rpk container stop"

[tasks."kafka:status"]
description = "Show local Redpanda container status"
run = "rpk container status"

[tasks."kafka:purge"]
description = "Stop and remove the local Redpanda container cluster and its data"
run = "rpk container purge"
