[tools]
bun = "latest"
node = "latest"
rpk = "26.2.2"
rust = "latest"
taplo = "latest"
viteplus = "latest"

"cargo:cargo-audit" = "latest"
"cargo:cargo-machete" = "latest"
"cargo:cargo-mutants" = "latest"
"cargo:cargo-nextest" = "latest"

[tasks."helm:lint"]
description = "Lint the Helm chart"
run = "helm lint charts/klens"

[tasks."helm:test"]
description = "Run helm-unittest template tests (needs the helm-unittest plugin)"
run = "helm unittest charts/klens"

[tasks."toml:fmt"]
description = "Format the Cargo manifests with taplo"
run = "taplo fmt"

[tasks.types]
description = "Regenerate web/src/api/types.gen.ts from the API types"
run = "cargo xtask types"

[tasks."web:install"]
description = "Install web dependencies"
dir = "web"
run = "vp install"

[tasks."web:dev"]
description = "Run the Vite dev server (proxies /api to :8080)"
dir = "web"
depends = ["web:install"]
run = "vp dev"

[tasks."web:check"]
description = "Format, lint, and type-check the web UI"
dir = "web"
depends = ["web:install"]
run = "vp check"

[tasks."web:build"]
description = "Build the web UI into static/"
dir = "web"
depends = ["web:install"]
run = "vp run build"

[tasks."docs:install"]
description = "Install docs site dependencies"
dir = "docs"
run = "bun install"

[tasks."docs:dev"]
description = "Run the docs site dev server on :3000"
dir = "docs"
depends = ["docs:install"]
run = "bun run dev"

[tasks."docs:build"]
description = "Build the static docs site into docs/out/"
dir = "docs"
depends = ["docs:install"]
run = "bun run build"

[tasks."kafka:up"]
description = "Start local Redpanda (Kafka :9092, Schema Registry :8081; needs Docker/Podman)"
run = """
rpk container start \
  --kafka-ports 9092 \
  --schema-registry-ports 8081 \
  --console-port 8002
"""

[tasks."kafka:down"]
description = "Stop the local Redpanda container cluster"
run = "rpk container stop"

[tasks."kafka:status"]
description = "Show local Redpanda container status"
run = "rpk container status"

[tasks."kafka:purge"]
description = "Stop and remove the local Redpanda container cluster and its data"
run = "rpk container purge"
