[tools]
bun = "latest"
node = "latest"
rust = "latest"

[tasks."web:install"]
description = "Install web dependencies"
dir = "web"
run = "bun install"

[tasks."web:dev"]
description = "Run the Vite dev server (proxies /api and /health to :8080)"
dir = "web"
depends = ["web:install"]
run = "bun run dev"

[tasks."web:build"]
description = "Build the web UI into static/"
dir = "web"
depends = ["web:install"]
run = "bun run build"
