schema {
  query: Query
  subscription: Subscription
}

enum AclAuthorizer {
  ENABLED
  DISABLED
}

enum AclOperation {
  ALL
  READ
  WRITE
  CREATE
  DELETE
  ALTER
  DESCRIBE
  CLUSTER_ACTION
  DESCRIBE_CONFIGS
  ALTER_CONFIGS
  IDEMPOTENT_WRITE
}

enum AclPatternType {
  LITERAL
  PREFIXED
}

enum AclPermission {
  ALLOW
  DENY
}

enum AclResourceType {
  TOPIC
  GROUP
  CLUSTER
  TRANSACTIONAL_ID
  DELEGATION_TOKEN
}

enum CleanupPolicy {
  DELETE
  COMPACT
  COMPACT_DELETE
}

enum Compression {
  NONE
  GZIP
  SNAPPY
  LZ4
  ZSTD
}

enum ConfigSource {
  DYNAMIC_TOPIC_CONFIG
  DYNAMIC_BROKER_CONFIG
  STATIC_BROKER_CONFIG
  DEFAULT_CONFIG
}

enum GroupState {
  STABLE
  EMPTY
  PREPARING_REBALANCE
  COMPLETING_REBALANCE
  DEAD
}

enum PrivilegeName {
  RECORDS
  CONFIGS
  SCHEMA_TEXT
  ACLS
}

enum RecordOrder {
  NEWEST
  OLDEST
}

enum ResyncReason {
  "The client fell behind the change bus and missed events." LAGGED
}

enum Role {
  VIEWER
  ADMIN
}

enum SchemaCompatibility {
  BACKWARD
  FORWARD
  FULL
  NONE
}

enum SchemaType {
  AVRO
  JSON
  PROTOBUF
}

enum SearchKind {
  TOPIC
  GROUP
  NODE
  SUBJECT
}

enum TopicSortField {
  NAME
  RATE
  RETAINED_MESSAGES
  PARTITIONS
  GROUPS
}

"A substring match or a CEL expression, never both."
input RecordFilterInput {
  contains: String
  cel: String
}

input RecordQueryInput {
  topic: String!
  partition: Int
  """
    Nullable rather than defaulted because juniper renders an enum
    default as a quoted string, which is not valid SDL.
  """ order: RecordOrder
  from: DateTime
  to: DateTime
  limit: Int! = 50
  filter: RecordFilterInput
  schemaId: Int
  cursor: String
}

"""
  Server-side name filtering so a 10k-topic cluster's list page does not
  need the full set client-side.
"""
input RowFilter {
  contains: String
}

input TopicSort {
  """
    Nullable rather than defaulted because juniper renders an enum
    default as a quoted string, which is not valid SDL.
  """ field: TopicSortField
  desc: Boolean! = false
}

input UpdateScope {
  topic: String
  group: String
}

"""
  Combined date and time (with time zone) in [RFC 3339][0] format.

  Represents a description of an exact instant on the time-line (such as the
  instant that a user account was created).

  [`DateTime` scalar][1] compliant.

  See also [`chrono::DateTime`][2] for details.

  [0]: https://datatracker.ietf.org/doc/html/rfc3339#section-5
  [1]: https://graphql-scalars.dev/docs/scalars/date-time
  [2]: https://docs.rs/chrono/latest/chrono/struct.DateTime.html
"""
scalar DateTime

"""
  Signed 64-bit integer, serialized as a string.

  Offsets, watermarks, lag and retained counts routinely pass 2^53, where a
  JSON number silently loses precision in every JavaScript client. A string
  crosses the wire intact. Input accepts either a string or an `Int`.
"""
scalar Int64

type Acl {
  resourceType: AclResourceType!
  resourceName: String!
  patternType: AclPatternType!
  principal: String!
  host: String!
  operation: AclOperation!
  permission: AclPermission!
}

type AclListing {
  authorizer: AclAuthorizer!
  bindings: [Acl!]!
}

type BrokerRow {
  id: Int!
  host: String!
  port: Int!
  rack: String
  controller: Boolean!
  partitionCount: Int!
  leaderCount: Int!
}

"""
  What the session may do on one cluster. Pairwise: a wider grant elsewhere
  does not raise this one.
"""
type ClusterGrant {
  cluster: String!
  role: Role!
  privileges: [PrivilegeName!]!
}

"""
  Per-lane freshness and the counts a dashboard header needs. Replaces
  polling a catalog just to learn how stale it is.
"""
type ClusterHealth {
  cluster: String!
  ready: Boolean!
  topology: LaneHealth!
  watermarks: LaneHealth!
  offsets: LaneHealth!
  configs: LaneHealth!
  subjects: LaneHealth!
  topicCount: Int!
  partitionCount: Int!
  groupCount: Int!
  brokerCount: Int!
  subjectCount: Int!
  underReplicatedPartitions: Int!
  offlinePartitions: Int!
}

type ConfigEntry {
  name: String!
  value: String
  source: ConfigSource!
  readOnly: Boolean!
  sensitive: Boolean!
}

type ConfigsChanged {
  version: Int64!
  topics: [String!]!
}

type GroupDetail {
  id: String!
  state: GroupState!
  protocol: String!
  coordinatorId: Int!
  members: [GroupMember!]!
  offsets: [GroupOffset!]!
  totalLag: Int64!
  lagComplete: Boolean!
}

type GroupLagUpdate {
  at: DateTime!
  group: String!
  lag: Int64!
  lagComplete: Boolean!
  offsets: [GroupOffset!]!
}

type GroupMember {
  id: String!
  clientId: String!
  host: String!
  assignments: [MemberAssignment!]!
}

type GroupOffset {
  topic: String!
  partition: Int!
  currentOffset: Int64!
  endOffset: Int64!
  lag: Int64!
  memberId: String
}

type GroupRow {
  id: String!
  state: GroupState!
  memberCount: Int!
  topicNames: [String!]!
  totalLag: Int64!
  """
    False when a committed partition had no watermark to join against, so
    the total understates the real lag.
  """
  lagComplete: Boolean!
  coordinatorId: Int!
}

type GroupRowPage {
  rows: [GroupRow!]!
  total: Int!
  nextCursor: String
}

type Identity {
  "`null` when authentication is disabled."
  subject: String
  clusters: [ClusterGrant!]!
}

type LaneHealth {
  updatedAt: DateTime
  checkedAt: DateTime
  lastError: String
  lastPollMs: Int64
  "False once a lane has failed since its last successful commit."
  healthy: Boolean!
}

type MemberAssignment {
  topic: String!
  partitions: [Int!]!
}

type PartitionRow {
  id: Int!
  leader: Int!
  replicas: [Int!]!
  isr: [Int!]!
  lowWatermark: Int64!
  highWatermark: Int64!
  retained: Int64!
  underReplicated: Boolean!
}

type Point {
  at: DateTime!
  value: Float!
}

type Query {
  "Who the session is and, per cluster, exactly what it may do."
  whoami: Identity!
  """
    Per-lane freshness and counts for every visible cluster. Replaces
    polling a catalog just to discover how stale it is.
  """
  clusters: [ClusterHealth!]!
  topicRows(cluster: String!, filter: RowFilter, sort: TopicSort, after: String, limit: Int): TopicRowPage!
  topic(cluster: String!, name: String!): TopicDetail
  topicGroups(cluster: String!, topic: String!): [TopicGroupRow!]!
  """
    Served from the config lane, not the broker: a config sweep is slow
    and its result is the same for everyone.
  """
  topicConfigs(cluster: String!, name: String!): [ConfigEntry!]!
  groupRows(cluster: String!, filter: RowFilter, after: String, limit: Int): GroupRowPage!
  """
    Registers interest, which promotes the group to the offsets lane's
    fast tier while someone is looking at it.
  """
  group(cluster: String!, id: String!): GroupDetail
  brokerRows(cluster: String!): [BrokerRow!]!
  "No lane sweeps broker configs, so this one stays live."
  brokerConfigs(cluster: String!, id: Int!): [ConfigEntry!]!
  subjectRows(cluster: String!): SubjectRowsResult!
  """
    Schema bodies are large, rarely read, and privileged, so the subjects
    lane keeps only the listing and the body is fetched on demand.
  """
  subject(cluster: String!, name: String!, version: Int): SubjectDetail!
  acls(cluster: String!): AclListing!
  records(cluster: String!, query: RecordQueryInput!): RecordPage!
  """
    The same points the subscription streams, with the same server
    timestamps, so seeding a chart and then following the stream produces
    one coherent series.
  """
  topicRateHistory(cluster: String!, topic: String!): [Point!]!
  groupLagHistory(cluster: String!, group: String!): [Point!]!
  """
    Answered from the prebuilt index, so a per-keystroke search never
    walks the catalog.
  """
  search(cluster: String!, term: String!): [SearchHit!]!
}

type Record {
  topic: String!
  partition: Int!
  offset: Int64!
  timestamp: DateTime!
  key: String
  value: String
  schemaId: Int
  headers: [RecordHeader!]!
  sizeBytes: Int64!
  compression: Compression!
}

type RecordHeader {
  key: String!
  value: String!
}

type RecordPage {
  records: [Record!]!
  """
    False when the scan hit its deadline with windows still unread: the
    records are real, but the page is not everything the query matched.
    `nextCursor` resumes where the scan stopped.
  """
  complete: Boolean!
  """
    True when an obfuscation rule covers this topic. Keys, values, and
    headers are then a view of the records: protected fields render as
    `***` or as `kx:` tokens, a value that never decoded may be masked
    whole, and filters match that view rather than the wire record.
  """
  obfuscated: Boolean!
  nextCursor: String
  prevCursor: String
}

"""
  Refetch the projections and keep the stream: the deltas in between are
  gone, but the connection is still good.
"""
type Resync {
  reason: ResyncReason!
}

type SchemaReference {
  name: String!
  subject: String!
  version: Int!
}

type SearchHit {
  kind: SearchKind!
  id: String!
  label: String!
  detail: String!
}

type SubjectDetail {
  subject: String!
  version: Int!
  id: Int!
  type: SchemaType!
  schema: String!
  references: [SchemaReference!]!
}

type SubjectRow {
  subject: String!
  id: Int!
  type: SchemaType!
  latestVersion: Int!
  versions: [Int!]!
  compatibility: SchemaCompatibility!
}

"""
  Registry degradation is typed rather than hidden: an empty `rows` with an
  unhealthy `sourceHealth` is a registry outage, not a registry with no
  subjects.
"""
type SubjectRowsResult {
  rows: [SubjectRow!]!
  sourceHealth: LaneHealth!
}

type SubjectsChanged {
  version: Int64!
  added: [String!]!
  removed: [String!]!
  changed: [String!]!
}

type Subscription {
  """
    Every lane delta for one cluster, optionally narrowed to one topic or
    group.

    A scoped subscriber pays only for its own page: the all-topics
    watermark firehose exists for list pages, and even that carries one
    `{topic, rate}` pair per topic rather than catalog objects.
  """
  updates(cluster: String!, scope: UpdateScope): Update!
}

type TopicDetail {
  name: String!
  internal: Boolean!
  partitions: [PartitionRow!]!
  replicationFactor: Int!
  retainedMessages: Int64!
  producedTotal: Int64!
  groupCount: Int!
  underReplicated: Boolean!
}

"""
  The projection a topic page needs: which groups read this topic and how
  far behind they are on it alone.
"""
type TopicGroupRow {
  id: String!
  state: GroupState!
  memberCount: Int!
  lagOnTopic: Int64!
}

type TopicRate {
  topic: String!
  rate: Float!
}

type TopicRow {
  name: String!
  internal: Boolean!
  partitionCount: Int!
  replicationFactor: Int!
  "Messages currently in the log (`Σ high − low`)."
  retainedMessages: Int64!
  """
    Messages ever produced (`Σ high`). Overstates a retention-truncated
    topic, so it is not the display default.
  """
  producedTotal: Int64!
  rate: Float!
  retentionMs: Int64!
  cleanupPolicy: CleanupPolicy!
  groupCount: Int!
  underReplicated: Boolean!
}

type TopicRowPage {
  rows: [TopicRow!]!
  """
    Rows matching the filter before paging, so a client can size its
    scrollbar without walking every page.
  """
  total: Int!
  nextCursor: String
}

type TopologyDelta {
  version: Int64!
  addedTopics: [String!]!
  removedTopics: [String!]!
  changedTopics: [String!]!
  addedGroups: [String!]!
  removedGroups: [String!]!
  changedGroups: [String!]!
  brokersChanged: Boolean!
}

type WatermarksTick {
  at: DateTime!
  """
    One `{topic, rate}` pair per topic, never catalog objects. A scoped
    subscriber gets only its topic.
  """
  topics: [TopicRate!]!
  clusterRate: Float!
}

union Update = WatermarksTick | GroupLagUpdate | TopologyDelta | ConfigsChanged | SubjectsChanged | Resync
