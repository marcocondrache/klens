# klens service configuration.
#
# Copy this file to config.yaml and adjust it for your environment.
#
# Every secret names where to read it, so secrets can stay out of this file:
# {value: ...} inline, {env: NAME} from an environment variable, or
# {file: PATH} from a file such as a mounted Kubernetes secret. A trailing
# newline in a secret file is dropped.
bind: 0.0.0.0:8080
log_level: info

# Clusters by name, shown in the UI in this order. Each name appears once.
clusters:
  local:
    bootstrap_servers:
      - localhost:9092

    # SASL and TLS are optional. Example:
    # security:
    #   protocol: SASL_SSL
    #   sasl:
    #     mechanism: SCRAM-SHA-512
    #     username: klens
    #     password: {env: KAFKA_PASSWORD}
    #   tls:
    #     ca_cert: /path/to/ca.pem
    #     client:
    #       cert: /path/to/client.pem
    #       key: /path/to/client.key
    #     insecure_skip_verify: false

    # Optional Kafka transport overrides. Timeouts are unsigned millisecond numbers.
    # request_timeout_ms is raised to connect_timeout_ms if smaller.
    # properties:
    #   client_id: klens-local
    #   request_timeout_ms: 10000
    #   connect_timeout_ms: 10000

    # Optional ingest cadence, in seconds. Omitted keys use the defaults
    # below. Values must be at least 1.
    # ingest:
    #   topology_secs: 10
    #   watermark_secs: 3
    #   config_secs: 60
    #   subjects_secs: 30
    #   offset_tick_secs: 1
    #   fast_offset_secs: 2
    #   slow_offset_secs: 20

    # Optional Confluent-compatible Schema Registry. When omitted, the Schemas
    # page is empty for this cluster.
    #
    # Credentials may only travel over plaintext `http://` when the host is
    # loopback. A remote registry that needs a username and password must be
    # reached over `https://`, otherwise startup fails for this cluster.
    schema_registry:
      url: http://localhost:8081
      # auth:
      #   username: klens
      #   password: {env: SCHEMA_REGISTRY_PASSWORD}

    # Optional server-side obfuscation. Rules are per topic, compiled at boot,
    # and applied before filters run, so a filter can only ever match what the
    # page itself shows. Applies to every session, admins included.
    #
    # obfuscation:
    #   # Required as soon as one rule hashes. Base64 or plain text, 32+ bytes.
    #   # Rotating it changes every token.
    #   secret: {env: KLENS_OBFUSCATION_SECRET}
    #   rules:
    #     # Field rules walk the JSON a registry decode produced. An array met
    #     # on the path fans out, so items.sku covers every element's sku.
    #     - topics: ["payments.*"]   # exact name, or a trailing-* prefix
    #       fields:
    #         - path: card.number
    #           strategy: hash       # kx:3f9a2c481b7d6e05, equal values match
    #         - path: card.cvv
    #           strategy: drop       # the field disappears
    #         - path: customer.email
    #           strategy: mask       # ***
    #       # A value that never decoded cannot be walked: mask it whole
    #       # (default) or serve it as it came off the wire.
    #       unparsed: mask           # mask | allow
    #     # Whole-field rules, for topics browsed as raw text.
    #     - topics: ["audit.raw"]
    #       key: mask
    #       value: hash
    #       headers: ["x-user-id"]   # header values to mask, by name
    #     # Pattern rules, for schemaless text topics no registry decodes.
    #     # They run on the rendered text of key and value, only on topics
    #     # named here, and are weaker than field rules: a value in an
    #     # unexpected format slips past the regex.
    #     - topics: ["app.logs"]
    #       patterns:
    #         - regex: '\b\d{13,19}\b'
    #           strategy: hash       # the match becomes a token
    #         - regex: '[\w.+-]+@[\w-]+\.[\w.]+'
    #           strategy: mask       # the match becomes ***

# Optional OpenID Connect login gate. When omitted, the UI and JSON API are
# open to anyone who can reach the process. /health and /ready stay public either way.
#
# Register redirect_uri with the identity provider. Without roles, any
# authenticated user has the same access as an open deployment. With roles,
# unmatched users cannot sign in. A role is a name for a set of privileges:
# each role grants exactly the privileges it lists, out of records, configs,
# schema_text, and acls. An empty list still sees the catalog. A role's
# bindings name the groups that hold it. Omit clusters on a binding to allow
# every configured cluster.
#
# auth:
#   oidc:
#     issuer: https://keycloak.example.com/realms/klens
#     client_id: klens
#     client_secret: {env: OIDC_CLIENT_SECRET}
#     redirect_uri: http://localhost:8080/api/auth/callback
#     # scopes: [openid, email, profile]
#     # cookie_secure: false  # default: true when redirect_uri is https
#     # groups_claim: groups  # the ID token claim that lists a user's groups
#   roles:
#     admin:
#       privileges: [records, configs, schema_text, acls]
#       bindings:
#         - groups: [klens-admins]
#     viewer:
#       privileges: []  # catalog only: clusters, topics, groups, no payloads
#       bindings:
#         - groups: [klens-viewers]
#     operator:
#       privileges: [records, configs]
#       bindings:
#         - groups: [kafka-operators]
#           clusters: [staging, dev]
#     auditor:
#       privileges: [acls, schema_text]
#       bindings:
#         - groups: [security-team]
