# klens service configuration.
#
# Copy this file to config.yaml and adjust it for your environment.
#
# Values may reference environment variables, so secrets can stay out of this
# file: ${VAR}, $VAR, ${VAR:-default}. Use $$ for a literal dollar sign.
bind: 0.0.0.0:8080
log_level: info

# Seconds between background topic-catalog polls for each cluster (default 5).
# GraphQL topics/clusterCatalog read the last snapshot instead of hitting Kafka.
# catalog_poll_interval_secs: 5

clusters:
  - name: local
    bootstrap_servers:
      - localhost:9092

    # SASL and TLS are optional. Example:
    # security:
    #   protocol: SASL_SSL
    #   sasl:
    #     mechanism: SCRAM-SHA-512
    #     username: ${KAFKA_USERNAME}
    #     password: ${KAFKA_PASSWORD}
    #   tls:
    #     ca_cert: /path/to/ca.pem
    #     client_cert: /path/to/client.pem
    #     client_key: /path/to/client.key
    #     insecure_skip_verify: false

    # Extra librdkafka properties, applied on top of the settings above.
    # properties:
    #   request.timeout.ms: "10000"

    # Optional Confluent-compatible Schema Registry. When omitted, the Schemas
    # page is empty for this cluster.
    schema_registry:
      url: http://localhost:8081
      # username: ${SCHEMA_REGISTRY_USERNAME}
      # password: ${SCHEMA_REGISTRY_PASSWORD}

# Optional OpenID Connect login gate. When omitted, the UI and GraphQL API are
# open to anyone who can reach the process. /health stays public either way.
#
# Register redirect_uri with the identity provider. Any authenticated user has
# the same access as an open deployment.
#
# auth:
#   oidc:
#     issuer: https://keycloak.example.com/realms/klens
#     client_id: klens
#     client_secret: ${OIDC_CLIENT_SECRET}
#     redirect_uri: http://localhost:8080/auth/callback
#     # scopes: [openid, email, profile]
#     # cookie_secure: false  # default: true when redirect_uri is https
